<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name=""viewport" content="width=device=width, initial-scale=1.0">
    <title>Genshin Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12121e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .search-card {
            background-color: #1a1a2e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        input {
            width: 80%;
            padding: 12px;
            margin: 20px 0;
            border-radius: 6px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #232338;
            color: white;
            font-size: 16px;
        }
        button {
            background-color: #4f46e5;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="search-card">
        <h1 style="margin-top: 0;">Genshin Tracker</h1>
        <p style="color: #aaa;">Enter your UID to search for your Genshin Impact stats.</p>
        <form onsubmit="event.preventDefault(); window.location.href='/player/' + document.getElementById('uid').value;">
            <input type="text" id="uid" placeholder="e.g. 123456789" required>
            <br>
            <button type="submit">Search Profile</button>
        </form>
    </div>
</body>
</html>
